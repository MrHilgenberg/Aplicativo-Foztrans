name: app_horarios_foz
description: "An app for seeing bus schedules and trip planning."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  flutter_local_notifications: ^23.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/fozbus_icone.png"
  min_sdk_android: 21
  adaptive_icon_background: "#12325B"
  adaptive_icon_foreground: "assets/fozbus_icone.png"

flutter_native_splash:
  color: "#12325B"
  image: "assets/fozbus_logo.png"
  color_dark: "#12325B"
  image_dark: "assets/fozbus_logo.png"
  android_12:
    color: "#12325B"
    image: "assets/fozbus_logo.png"
    icon_background_color: "#FFFFFF"
